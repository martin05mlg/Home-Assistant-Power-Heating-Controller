set_max_power:
  fields:
    watts:
      required: true
      selector:
        number:
          min: 500
          max: 50000
          step: 100
          unit_of_measurement: W
          mode: box

add_room:
  fields:
    room_name:
      required: true
      example: Living room
      selector:
        text:
    heater_type:
      required: true
      selector:
        select:
          options:
            - climate
            - switch
    heater_entity:
      required: true
      selector:
        entity:
          domain:
            - climate
            - switch
    temp_sensor:
      required: true
      selector:
        entity:
          domain: sensor
          device_class: temperature
    target_temp:
      default: 20
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: °C
    power_w:
      default: 1000
      selector:
        number:
          min: 50
          max: 10000
          step: 50
          unit_of_measurement: W
          mode: box
    priority:
      default: 5
      selector:
        number:
          min: 1
          max: 10
          step: 1
    hvac_mode_heat:
      default: heat
      selector:
        text:
    force_max_temp:
      default: true
      selector:
        boolean:

remove_room:
  fields:
    room_id:
      required: true
      example: living_room
      selector:
        text:

set_room_target_temp:
  fields:
    room_id:
      required: true
      example: living_room
      selector:
        text:
    target_temp:
      required: true
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: °C

enable_room:
  fields:
    room_id:
      required: true
      example: living_room
      selector:
        text:

disable_room:
  fields:
    room_id:
      required: true
      example: living_room
      selector:
        text:
